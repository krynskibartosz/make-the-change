name: Web Client TS Quality

on:
  pull_request:
    paths:
      - 'apps/web-client/**'
      - 'packages/core/src/shared/db/**'
      - 'packages/core/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-client-types-quality.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict indexed access gate
        run: pnpm --filter @make-the-change/web-client exec tsc --noEmit --noUncheckedIndexedAccess

      - name: TypeScript metrics gate
        run: pnpm --filter @make-the-change/web-client ts:metrics:check
