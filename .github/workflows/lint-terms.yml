name: Lint Terminologie

on:
  pull_request:
    types: [opened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-terms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan forbidden terms
        run: |
          set -euo pipefail
          echo "Scanning for forbidden terms per docs/10-reference-content/GLOSSARY.md"
          forbid='investisseur|Investisseur|investisseurs|Investisseurs|abonné premium|crédits|boutique|\bshop\b|fournisseurs|actifs|Revenus mensuels|Paiement mensuel|paiement annuel|Next\.js 1[0-4]|TanStack Start'

          base_ref="origin/${GITHUB_BASE_REF:-main}"

          echo "Diffing against $base_ref"

          # Use git diff-tree if it's a single commit or handle range
          # Fichiers ajoutes/modifies seulement (un fichier supprime ferait echouer rg),
          # et jamais ce workflow lui-meme : il contient la liste des termes interdits.
          files=$( (git diff --name-only --diff-filter=ACMR "$base_ref...HEAD" || git diff --name-only --diff-filter=ACMR HEAD~1 HEAD || echo "") | grep -v '^\.github/workflows/lint-terms\.yml$' || true)

          if [ -z "$files" ]; then
            echo "No files changed."
            exit 0
          fi

          if echo "$files" | xargs -r rg -n --pcre2 "$forbid"; then
            echo "Forbidden terms detected. Please align with docs/10-reference-content/GLOSSARY.md" >&2
            exit 1
          else
            echo "OK: no forbidden terms"
          fi
